<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yashome - your home on one screen</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<!-- A slide show of Yashome: every step of setting up a home, shown. No outside files: the screenshots are in img/<lang>/. -->
<style>
  :root{--bg:#0E1116;--card:#1A1F29;--line:#2a313d;--txt:#E6EAF0;--dim:#8A93A3;--acc:#177A75;--teal:#3CC2B8;--acc2:#FFC34D;--ok:#3ddc84;--blue:#5b8cff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(300px,32%) 1fr;gap:4vw;align-items:center;
         padding:8vh 5vw 11vh;opacity:0;pointer-events:none;transition:opacity .6s ease}
  .slide.on{opacity:1;pointer-events:auto}
  .slide.wide{grid-template-columns:minmax(280px,27%) 1fr;gap:3vw}
  .slide.center{grid-template-columns:1fr;text-align:center;justify-items:center}
  .step{color:var(--teal);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin-bottom:10px}
  h1{font-size:clamp(34px,4.6vw,64px);line-height:1.05;margin:0 0 18px;letter-spacing:-.02em}
  h2{font-size:clamp(26px,2.8vw,42px);line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
  p.lead{color:var(--dim);font-size:clamp(16px,1.3vw,20px);margin:0 0 14px;max-width:34em}
  ul.points{list-style:none;padding:0;margin:18px 0 0}
  ul.points li{padding:7px 0 7px 38px;position:relative;color:var(--txt)}
  ul.points li b{position:absolute;left:0;top:5px;width:26px;height:26px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:14px}
  ul.points li code{color:var(--ok);font:15px ui-monospace,Consolas,monospace}
  .on ul.points li{animation:rise .6s ease both}
  .on ul.points li:nth-child(2){animation-delay:.25s} .on ul.points li:nth-child(3){animation-delay:.5s} .on ul.points li:nth-child(4){animation-delay:.75s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  @keyframes slidel{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes ripple{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(4.5)}}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}
  /* a picture or a mock in a browser frame */
  .shot{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line);background:#000}
  .shot .bar{height:26px;background:#232a35;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12px;color:var(--dim)}
  .shot .bar i{width:10px;height:10px;border-radius:50%;background:#3a4352;display:block}
  .shot .pic{position:relative}
  .shot img{display:block;width:100%;height:auto}
  .ripple{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid var(--acc2);opacity:0;z-index:4}
  .on .ripple{animation:ripple 1.1s ease-out var(--at,2.6s) both}
  .hide{display:none!important}
  /* slide 2: the terminal */
  .term{background:#0a0d12;border:1px solid var(--line);border-radius:14px;padding:22px 24px;font:15px/1.7 ui-monospace,"Cascadia Code",Consolas,monospace;
        min-height:340px;box-shadow:0 30px 80px rgba(0,0,0,.55);white-space:pre-wrap;word-break:break-all}
  .term .pr{color:var(--ok)} .term .ok{color:var(--ok)} .term .dim{color:#7f8ba0} .term .num{color:var(--acc2)}
  .term .caret{display:inline-block;width:9px;height:18px;background:var(--txt);vertical-align:-3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .bigline{font-size:clamp(20px,1.8vw,28px);font-weight:800;color:var(--acc2);margin-top:22px;opacity:0}
  .on .bigline{animation:pop .5s cubic-bezier(.2,1.4,.4,1) 5.4s both}
  /* the floor plan: walls draw themselves on slide 3, stand still elsewhere */
  svg.plan{width:100%;height:auto;display:block;overflow:visible}
  .plan .floor{fill:#141922}
  .plan .w{fill:none;stroke:#c9d3e0;stroke-linecap:square}
  .plan .w.o{stroke-width:10} .plan .w.i{stroke-width:6}
  .plan .d{fill:none;stroke:#8b97a8;stroke-width:2.5}
  .plan .win{fill:none;stroke:#6fb7ff;stroke-width:12} .plan .win2{fill:none;stroke:#141922;stroke-width:4}
  .plan .lbl{fill:#8A93A3;font-size:26px;font-weight:600;text-anchor:middle}
  .plan.draw .w,.plan.draw .d,.plan.draw .win,.plan.draw .win2{stroke-dasharray:1;stroke-dashoffset:1}
  .on .plan.draw .w,.on .plan.draw .d,.on .plan.draw .win,.on .plan.draw .win2{animation:draw .8s ease var(--d,0s) forwards}
  .plan.draw .lbl{opacity:0}
  .on .plan.draw .lbl{animation:pop .5s ease var(--d,6s) both}
  .plan.draw .floor{opacity:0} .on .plan.draw .floor{animation:fade 1s ease .2s both}
          border-radius:14px;padding:12px 18px;box-shadow:0 18px 40px rgba(0,0,0,.55);opacity:0;max-width:60%}
  /* slide 4: what works with it */
  .kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kind{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:left}
  .kind svg.ic{width:34px;height:34px;color:var(--acc2);margin-bottom:10px}
  .kind b{display:block;font-size:15px} .kind span{color:var(--dim);font-size:13px;display:block;margin-top:3px}
  .kind .ok{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center;opacity:0}
  .kind .ok svg{width:15px;height:15px}
  .on .kind{animation:pop .5s cubic-bezier(.2,1.4,.4,1) var(--d) both}
  .on .kind .ok{animation:pop .4s cubic-bezier(.2,1.6,.4,1) calc(var(--d) + 2.4s) both}
  .compat{margin-top:18px;display:inline-flex;align-items:center;gap:10px;background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.4);
          color:var(--ok);border-radius:999px;padding:8px 16px;font-weight:700;opacity:0}
  .on .compat{animation:pop .5s ease 4.2s both}
  /* slide 5: adding a device, a story in three scenes */
  /* slide 6: the map; slide 7 reuses its marks */
  .glowc{opacity:0} .on .glowc{animation:fade .6s ease var(--at) both}
  .on .lampon{animation:fade .3s ease var(--at) both} .lampon{opacity:0}
  .icn circle.bg{fill:#0E1116;stroke:var(--acc2);stroke-width:3}
  .icn path,.icn rect,.icn circle.s{fill:none;stroke:var(--acc2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  /* slide 7: a rule built from chips, then played on the plan */
  .rule{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:clamp(17px,1.4vw,22px);margin-bottom:18px}
  .rule .kw{color:var(--dim);font-weight:700;opacity:0}
  .rule .chip{border-radius:999px;padding:7px 16px;font-weight:700;opacity:0;border:2px solid}
  .chip.wh{background:rgba(91,140,255,.15);border-color:var(--blue);color:#a9c1ff}
  .chip.if{background:rgba(180,140,255,.15);border-color:#b48cff;color:#d5c3ff}
  .chip.th{background:rgba(255,195,77,.15);border-color:var(--acc2);color:var(--acc2)}
  .on .rule .kw{animation:fade .3s ease var(--at) both}
  .on .rule .chip{animation:pop .45s cubic-bezier(.2,1.5,.4,1) var(--at) both}
  .mini{position:relative}
  .on .motion{animation:ring 1s ease-out var(--at) 3 forwards}
  .motion{opacity:0;transform-box:fill-box;transform-origin:center}
  .halltint{fill:#ffcf5a;opacity:0} .on .halltint{animation:tint 4.2s ease var(--at) both}
  @keyframes tint{0%{opacity:0}10%,100%{opacity:.18}}
  .timer{fill:none;stroke:var(--acc2);stroke-width:8;stroke-dasharray:1;stroke-dashoffset:0;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center}
  .on .timer{animation:tick 4s linear var(--at) both}
  @keyframes tick{from{stroke-dashoffset:0}to{stroke-dashoffset:.66}}
  .timerg{opacity:0} .on .timerg{animation:fade .4s ease var(--at) both}
  /* slide 8: NFC stickers start rules */
  .taps{display:grid;grid-template-columns:1fr 1fr;gap:4%}
  .tap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;opacity:0}
  .on .tap{animation:rise .5s ease var(--at) both}
  .tap h4{margin:0 0 8px;font-size:15px;color:var(--dim);font-weight:600}
  .tap svg{width:100%;height:auto;display:block}
  .on .tap .ph{animation:tapph 1.4s cubic-bezier(.3,1.2,.5,1) var(--t) both}
  @keyframes tapph{0%{transform:translate(160px,60px) rotate(12deg);opacity:0}30%{opacity:1}70%,100%{transform:none;opacity:1}}
  .tap .wave{opacity:0;transform-box:fill-box;transform-origin:center}
  .on .tap .wave{animation:ring .9s ease-out calc(var(--t) + 1s) 2 forwards}
  .res{margin-top:12px;border-radius:12px;padding:10px 14px;background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.45);opacity:0}
  .res b{display:block;color:var(--ok)} .res span{color:var(--txt);font-size:14px}
  .on .res{animation:pop .5s cubic-bezier(.2,1.5,.4,1) calc(var(--t) + 1.6s) both}
  .on .lightoff{animation:loff .6s ease calc(var(--t) + 1.6s) both}
  @keyframes loff{to{opacity:.12}}
  .on .dooropen{animation:dopen .8s ease calc(var(--t) + 1.6s) both}
  @keyframes dopen{to{transform:scaleX(.35)}}
  .anyrule{margin-top:20px;display:inline-flex;gap:10px;align-items:center;background:rgba(60,194,184,.12);border:1px solid var(--teal);color:var(--teal);
           border-radius:999px;padding:9px 18px;font-weight:700;opacity:0}
  .on .anyrule{animation:pop .5s ease 6.8s both}
  /* slide 9: the family phone pairs by QR */
  .pair{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:4%;align-items:center}
  .dash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative}
  .dash h3{margin:0 0 4px;font-size:20px} .dash p{margin:0 0 14px;color:var(--dim);font-size:14px}
  .qr{width:62%;margin:0 auto;display:block;background:#fff;border-radius:10px;padding:10px}
  .qr svg{display:block;width:100%;height:auto}
  .on .dash{animation:rise .6s ease .2s both}
  .home-chip{margin-top:16px;display:flex;align-items:center;gap:10px;background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.45);border-radius:999px;
             padding:9px 16px;color:var(--ok);font-weight:700;opacity:0;width:max-content;max-width:100%}
  .home-chip i{width:12px;height:12px;border-radius:50%;background:var(--ok);display:block;box-shadow:0 0 10px var(--ok)}
  .on .home-chip{animation:pop .5s cubic-bezier(.2,1.5,.4,1) 5.4s both}
  .phonef{position:relative;width:100%;max-width:290px;aspect-ratio:824/1720;border-radius:30px;border:8px solid #262d38;background:#0a0d12;overflow:hidden;
          box-shadow:0 30px 60px rgba(0,0,0,.6);justify-self:center}
  .on .phonef{animation:phonein .8s cubic-bezier(.2,.8,.2,1) 1.0s both}
  @keyframes phonein{from{opacity:0;transform:translateX(120px) rotate(6deg)}to{opacity:1;transform:none}}
  .phonef img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0}
  .on .phonef img{animation:fade .5s ease 4.0s both}
  .cam{position:absolute;inset:0;display:grid;place-items:center;background:#11151c}
  .cam .qr{width:70%;opacity:.9}
  .cam .frame{position:absolute;left:10%;right:10%;top:28%;aspect-ratio:1;border:3px solid var(--ok);border-radius:14px}
  .cam .scan{position:absolute;left:12%;right:12%;height:3px;background:var(--ok);box-shadow:0 0 14px var(--ok);top:30%;opacity:0}
  .on .cam .scan{animation:scan 1.1s ease-in-out 1.9s 2 alternate both}
  @keyframes scan{0%{opacity:1;top:30%}100%{opacity:1;top:62%}}
  .cam .lab{position:absolute;bottom:12%;left:0;right:0;text-align:center;color:var(--dim);font-size:13px}
  .flash{position:absolute;inset:0;background:#fff;opacity:0} .on .flash{animation:flash .6s ease 3.8s both}
  @keyframes flash{0%{opacity:0}30%{opacity:.85}100%{opacity:0}}
  /* slide 10: a guest asks to come in */
  .guest{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto;gap:22px 4%;align-items:start}
  .gb{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)}
  .gb .in{padding:20px 22px;position:relative;min-height:190px}
  .gb h3{margin:0 0 6px;font-size:19px} .gb p{margin:0;color:var(--dim);font-size:14px}
  .code{font:700 38px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;margin:16px 0 6px;color:var(--acc2)}
  .code span{opacity:0;display:inline-block}
  .on .code span{animation:pop .3s ease both}
  .welcome{position:absolute;inset:0;background:#15291f;display:grid;place-items:center;text-align:center;padding:18px;opacity:0}
  .welcome b{display:block;color:var(--ok);font-size:22px} .welcome span{color:var(--dim);font-size:14px}
  .on .welcome{animation:fade .5s ease 5.0s both}
  .on .gb.a{animation:rise .5s ease .2s both}
  .gphone{grid-row:1 / span 2;grid-column:2;justify-self:center;width:100%;max-width:300px;border-radius:30px;border:8px solid #262d38;background:#11151c;
          padding:18px 14px;box-shadow:0 30px 60px rgba(0,0,0,.6);position:relative}
  .on .gphone{animation:phonein .7s cubic-bezier(.2,.8,.2,1) 1.4s both}
  .notif{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;opacity:0}
  .on .notif{animation:rise .5s ease 2.1s both}
  .notif b{display:block;font-size:14px} .notif span{color:var(--dim);font-size:13px}
  .notif .code2{color:var(--acc2);font:700 20px ui-monospace,Consolas,monospace;letter-spacing:.1em}
  .opts{margin-top:14px;opacity:0} .on .opts{animation:rise .5s ease 2.8s both}
  .opts .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .opts .o{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--dim)}
  .opts .o.sel1{border-color:var(--acc2);color:var(--acc2);background:rgba(255,195,77,.12)}
  .opts small{color:var(--dim);font-size:12px}
  .opts .scope{border:1px solid var(--acc2);background:rgba(255,195,77,.12);color:var(--acc2);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px}
  .allow{display:flex;gap:8px;margin-top:14px;position:relative}
  .allow div{flex:1;text-align:center;border-radius:10px;padding:9px;font-weight:700;font-size:14px}
  .allow .y{background:var(--acc);color:#fff} .allow .n{border:1px solid var(--line);color:var(--dim)}
  .lockc{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;opacity:0}
  .on .lockc{animation:rise .5s ease 5.8s both}
  .lockc .lk{position:relative;width:58px;height:58px;flex:none}
  .lockc .lk svg.l{width:58px;height:58px;color:var(--txt)}
  .lockc .sh{position:absolute;right:-10px;bottom:-8px;width:32px;height:32px;opacity:0}
  .on .lockc .sh{animation:pop .5s cubic-bezier(.2,1.6,.4,1) 6.5s both}
  .on .lockc .lk svg.l{animation:shake .5s ease 7.0s both}
  @keyframes shake{0%,100%{transform:none}20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
  .lockc b{display:block} .lockc span{color:var(--dim);font-size:14px}
  .keyline{margin-top:18px;display:flex;gap:10px;align-items:flex-start;color:var(--txt);font-size:15px;opacity:0}
  .keyline svg{width:24px;height:24px;flex:none;color:var(--ok)}
  .on .keyline{animation:rise .5s ease 1s both}
  /* the title and the end */
  .hero{position:absolute;inset:0;z-index:-1;opacity:.13;background-size:cover;background-position:center}
  .slide.center::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 55% 45% at 50% 50%,rgba(14,17,22,.92),rgba(14,17,22,.35) 70%,transparent)}
  .on .hero{animation:kenburns 16s ease-in-out both}
  @keyframes kenburns{from{transform:scale(1.1) translate(2%,1%)}to{transform:scale(1.25) translate(-3%,-2%)}}
  .logo{display:inline-flex;align-items:center;gap:16px;margin-bottom:26px}
  .logo .mark{width:64px;height:64px;border-radius:18px;background:var(--acc);display:grid;place-items:center}
  .logo .mark svg{width:40px;height:40px;color:#fff}
  .logo .word{font-size:44px;font-weight:800;letter-spacing:-.02em}
  .cta{display:inline-flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}
  .cta a{background:var(--acc);color:#fff;text-decoration:none;padding:14px 26px;border-radius:14px;font-weight:700;font-size:18px}
  .cta a:first-child{background:linear-gradient(90deg,var(--acc),#1f9d8f);animation:ctap 2s ease-in-out infinite}
  @keyframes ctap{0%,100%{box-shadow:0 0 0 0 rgba(60,194,184,.55)}50%{box-shadow:0 0 28px 6px rgba(60,194,184,.45)}}
  .cta a.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  /* the controls of the show */
  .nav{position:fixed;left:0;right:0;bottom:2.5vh;display:flex;align-items:center;justify-content:center;gap:16px;z-index:10}
  .dots{display:flex;gap:8px} .dots button{width:10px;height:10px;border-radius:50%;border:0;background:#3a4352;padding:0;cursor:pointer}
  .dots button.on{background:var(--acc2);width:28px;border-radius:6px}
  .nav .b{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;cursor:pointer;font:inherit;font-size:14px}
  .nav .b.on{border-color:var(--acc2);color:var(--acc2)}
  .skip{position:fixed;top:2.2vh;right:2vw;z-index:12;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:8px 16px;font-weight:700;font-size:14px;
        box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .skip:hover{filter:brightness(1.15)}
  .wm{height:150px;width:auto;display:block;margin:0 auto 6px}
  .wm.small{height:84px;margin-bottom:0}
  .corner{position:fixed;top:1.2vh;left:1.6vw;height:52px;z-index:12;transition:opacity .4s}
  body.c .corner{opacity:0}
  .bar-progress{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--acc2));box-shadow:0 0 12px var(--teal);width:0;z-index:11}
  .legend2{margin-top:14px;color:var(--dim);font-size:14px} .legend2 i{display:inline-block;width:34px;border-top:4px dashed #b48cff;vertical-align:middle;margin-right:8px}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
  /* the mouse scenes: a mock of the dashboard in one svg, driven by the script */
  svg.sc{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))}
  .sc text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#E6EAF0}
  .sc .win{fill:#11151d;stroke:#2a313d;stroke-width:2}
  .sc .btn rect{fill:#1a1f29;stroke:#343d4c;stroke-width:2} .sc .btn text{font-size:18px;text-anchor:middle;dominant-baseline:central}
  .sc .btn.on rect{fill:rgba(255,195,77,.16);stroke:#FFC34D} .sc .btn.on text{fill:#FFC34D}
  .sc .btn.pri rect{fill:#177A75;stroke:#3CC2B8} .sc .btn.pri text{font-weight:700}
  .sc .dimt{fill:#8A93A3} .sc .mono{font-family:ui-monospace,Consolas,monospace}
  .sc .wall{stroke:#9aa8bf;stroke-width:12;stroke-linecap:square;fill:none}
  .sc .card{fill:#1a1f29;stroke:#2a313d;stroke-width:2}
  .mc{pointer-events:none} .mc path{fill:#fff;stroke:#000;stroke-width:1.6}
  .rip{fill:none;stroke:#FFC34D;stroke-width:4}
  /* the advertising: glowing words, badges, counters */
  .glow{background:linear-gradient(90deg,#3CC2B8,#9ef0e8,#FFC34D,#3CC2B8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
        animation:shine 7s linear infinite;filter:drop-shadow(0 0 18px rgba(60,194,184,.35))}
  @keyframes shine{to{background-position:300% 0}}
  h2::after{content:"";display:block;width:84px;height:4px;border-radius:4px;margin-top:12px;background:linear-gradient(90deg,var(--teal),var(--acc2));box-shadow:0 0 14px rgba(60,194,184,.7)}
  .slide.center h2::after{margin:12px auto 0}
  .badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .slide.center .badges{justify-content:center}
  .badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;color:#E6EAF0;
         background:linear-gradient(#141922,#141922) padding-box,linear-gradient(90deg,var(--teal),var(--acc2)) border-box;border:2px solid transparent;
         box-shadow:0 0 18px rgba(60,194,184,.25);opacity:0}
  .badge::before{content:"✓";color:var(--ok);font-weight:900}
  .on .badge{animation:pop .5s cubic-bezier(.2,1.5,.4,1) var(--at,.5s) both}
  .stats{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:120px;opacity:0}
  .on .stat{animation:rise .5s ease var(--at,.5s) both}
  .stat b{display:block;font-size:34px;line-height:1.1;font-weight:800} .stat span{color:var(--dim);font-size:13px}
  .stat b.glow{filter:none} .stat b i{font-style:normal}
  .flow{display:flex;flex-direction:column;gap:7px;margin-top:16px;padding:0;list-style:none}
  .flow li{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:15px;opacity:.45}
  .flow li i{font-style:normal;width:24px;height:24px;flex:none;border-radius:50%;background:#2a313d;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--txt)}
  .on .flow li{animation:flowon .4s ease var(--at) both}
  @keyframes flowon{from{opacity:.45}to{opacity:1;color:#E6EAF0}}
  .on .flow li i{animation:flowi .4s ease var(--at) both}
  @keyframes flowi{to{background:var(--acc2);color:#0E1116}}
  @media (max-width:820px){
    .slide{grid-template-columns:1fr;gap:3vh;padding:9vh 5vw 14vh;overflow:auto;align-content:start}
    .kinds{grid-template-columns:repeat(2,1fr)}
    .pair,.guest{grid-template-columns:1fr} .gphone{grid-row:auto;grid-column:auto}
    .nav{gap:8px;flex-wrap:wrap;bottom:0;padding:10px 8px 14px;background:linear-gradient(to top,var(--bg) 80%,rgba(14,17,22,0))} .skip{top:1.5vh}
    .slide{padding-bottom:24vh} .slide.wide{grid-template-columns:1fr}  /* .wide outranks .slide: one column too */
  }
</style>
